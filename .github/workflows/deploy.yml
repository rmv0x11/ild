name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - run: npm ci

      - name: Build for GitHub Pages
        env:
          # Backend public URL (TryCloudflare while we don't have a domain).
          # NOTE: the TryCloudflare quick-tunnel URL is EPHEMERAL — it changes
          # every time cloudflared restarts (e.g. on server reboot), which
          # silently breaks the deployed frontend. Authoritative source is the
          # repo variable VITE_API_URL (Settings → Secrets and variables →
          # Actions → Variables); update it + re-run this workflow after any
          # tunnel-URL change. The literal below is only a fallback and must be
          # kept in sync with the live tunnel.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://databases-nested-collaborative-twin.trycloudflare.com' }}
          VITE_GOOGLE_ENABLED: ${{ vars.VITE_GOOGLE_ENABLED || 'false' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
