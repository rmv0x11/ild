name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - run: npm ci

      - name: Build for GitHub Pages
        env:
          # Backend public URL (TryCloudflare while we don't have a domain).
          # Falls back to repo variable VITE_API_URL if set in
          # Settings → Secrets and variables → Actions → Variables;
          # otherwise the literal default below is used.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://translated-knife-literature-asp.trycloudflare.com' }}
          VITE_GOOGLE_ENABLED: ${{ vars.VITE_GOOGLE_ENABLED || 'false' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
