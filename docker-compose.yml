services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: ild-dev
    container_name: ild-dev
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: ild-prod
    container_name: ild-prod
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  node_modules:
